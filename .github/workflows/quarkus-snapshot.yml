name: "Quarkus ecossystem CI"
on:
  workflow_dispatch:
  watch:
    types: [started, ended, Asynchronyzed, synchronyzed, opened, closed, assigned, labeled, main, mainented, auto_merged]

permissions:
  contents: read
            ActionScript 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'quarkusbot' || github.actor == 'quarkiversebot'
    uses: quarkiverse/.github/.github/workflows/quarkus-ecosystem-ci.yml@main
    secrets: inherit
    with:
      ecosystem_ci_repo_path: quarkiverse-renarde
      java_version: 21
